<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <!-- Importar Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Importar Iconos de Google -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
      body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
        padding: 0; 
        margin: 0; 
        color: #333; 
        background-color: #f5f5f5;
        overflow: hidden;
      }
      .header-container {
        background-color: #1a73e8;
        padding: 15px;
        color: white;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .header-container i { font-size: 24px; }
      .header-container span { font-size: 18px; font-weight: 500; }
      
      .content-area {
        padding: 25px 20px;
        text-align: center;
      }

      .warning-icon {
        font-size: 56px;
        color: #f4b400;
        margin-bottom: 15px;
      }

      .warning-text {
        font-size: 15px;
        line-height: 1.5;
        color: #3c4043;
        margin-bottom: 25px;
      }

      .footer-btns {
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      .btn-theme { background-color: #1a73e8 !important; }
      .btn-flat-grey { color: #5f6368 !important; }
      
      .loading-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255,255,255,0.9);
        z-index: 100;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="loader" class="loading-overlay">
      <div class="preloader-wrapper active">
        <div class="spinner-layer spinner-blue-only">
          <div class="circle-clipper left"><div class="circle"></div></div>
          <div class="gap-patch"><div class="circle"></div></div>
          <div class="circle-clipper right"><div class="circle"></div></div>
        </div>
      </div>
      <p style="margin-top: 15px;">Inicializando estructura...</p>
    </div>

    <div class="header-container">
      <i class="material-icons">settings_backup_restore</i>
      <span>Inicializar SheetsBot</span>
    </div>
    
    <div class="content-area">
      <i class="material-icons warning-icon">report_problem</i>
      <div class="warning-text">
        Parece que esta hoja de cálculo ya ha sido inicializada.<br><br>
        Si continúas, <b>se restablecerán todos los valores de configuración</b> a sus estados por defecto. Esta acción no se puede deshacer.
      </div>

      <div class="footer-btns">
        <button class="btn-flat btn-flat-grey waves-effect" onclick="google.script.host.close()">Cancelar</button>
        <button class="btn waves-effect waves-light red darken-2" onclick="confirmInit()">Reinicializar Hoja</button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
      function confirmInit() {
        document.getElementById('loader').style.display = 'flex';
        google.script.run
          .withSuccessHandler(() => {
            M.toast({html: 'Hoja inicializada con éxito'});
            setTimeout(() => google.script.host.close(), 1000);
          })
          .withFailureHandler((err) => {
            document.getElementById('loader').style.display = 'none';
            alert('Error: ' + err.message);
          })
          .executeSetupSheet();
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  </body>
</html>
