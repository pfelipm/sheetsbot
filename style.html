<style>
  :root {
    --primary-color: <?= accentColor ?>;
    --bg-color: #f5f7f9;
    --text-color: #333;
    --bot-msg-bg: #fff;
    --user-msg-bg: <?= accentColor ?>;
    --user-msg-text: #fff;
    --border-radius: 12px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .chat-container {
    width: 100%;
    max-width: 600px;
    height: 95vh;
    background: white;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    border-radius: 15px;
    margin: 10px;
  }

  header {
    padding: 20px;
    background: var(--primary-color);
    color: white;
    text-align: center;
    border-radius: 15px 15px 0 0;
  }

  header h1 {
    font-size: 1.5rem;
    margin-bottom: 5px;
  }

  header p {
    font-size: 0.9rem;
    opacity: 0.9;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    scroll-behavior: smooth;
  }

  .message {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: var(--border-radius);
    line-height: 1.5;
    position: relative;
    font-size: 0.95rem;
  }

  .bot-message {
    align-self: flex-start;
    background-color: var(--bot-msg-bg);
    border: 1px solid #e1e4e8;
    color: var(--text-color);
    border-bottom-left-radius: 2px;
  }

  .user-message {
    align-self: flex-end;
    background-color: var(--user-msg-bg);
    color: var(--user-msg-text);
    border-bottom-right-radius: 2px;
  }

  /* Markdown Styling */
  .message p { margin-bottom: 8px; }
  .message ul, .message ol { margin-left: 20px; margin-bottom: 8px; }
  .message code { background: rgba(0,0,0,0.05); padding: 2px 4px; border-radius: 4px; }
  .message pre { background: #f8f9fa; padding: 10px; border-radius: 8px; overflow-x: auto; margin-bottom: 10px; border: 1px solid #eee; }

  .input-container {
    padding: 20px;
    border-top: 1px solid #eee;
  }

  #chat-form {
    display: flex;
    gap: 10px;
  }

  #user-input {
    flex: 1;
    padding: 12px 15px;
    border: 2px solid #eee;
    border-radius: 25px;
    outline: none;
    transition: border-color 0.3s;
    font-size: 1rem;
  }

  #user-input:focus {
    border-color: var(--primary-color);
  }

  #send-button {
    background: var(--primary-color);
    color: white;
    border: none;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.2s, background 0.3s;
  }

  #send-button:hover {
    background: #357abd;
    transform: scale(1.05);
  }

  #send-button:disabled {
    background: #ccc;
    cursor: not-allowed;
  }

  .typing {
    font-style: italic;
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 5px;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .chat-container {
      height: 100vh;
      margin: 0;
      border-radius: 0;
    }
    header { border-radius: 0; }
  }
</style>
